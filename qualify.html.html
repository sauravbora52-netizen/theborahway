<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Brand Assessment — The Borah Way</title>
  <meta name="description" content="Watch this before you book the assessment. Know where your brand is leaking and what to do about it.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;600&display=swap">
  <style>
    /* The Borah Way — Assessment landing page (video + CTA). */
    :root {
      --bg: #0E0D0B;
      --fg: #ECE7DE;
      --fg-dim: #8B8578;
      --fg-faint: #3A362F;
      --accent: #D4502A;
      --rule: #221F1B;

      --f-display: 'Space Mono', ui-monospace, 'SF Mono', Menlo, monospace;
      --f-body: 'Space Grotesk', -apple-system, system-ui, sans-serif;

      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    html { height: 100%; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--f-body);
      font-size: 16px;
      line-height: 1.5;
      padding-left: max(20px, env(safe-area-inset-left, 0px));
      padding-right: max(20px, env(safe-area-inset-right, 0px));
      -webkit-font-smoothing: antialiased;
      position: relative;
      min-height: 100%;
    }

    .col-rule {
      position: fixed;
      top: 0;
      bottom: 0;
      width: 1px;
      background: var(--fg);
      opacity: 0.055;
      pointer-events: none;
      z-index: 1;
    }

    /* topbar — wordmark only */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: center;
      padding-block: 22px;
      border-bottom: 1px solid var(--rule);
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--bg);
    }
    .mark {
      font-family: var(--f-display);
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0;
      word-spacing: 0.35em;
      color: var(--fg);
      white-space: nowrap;
      text-transform: lowercase;
      display: inline-flex;
      align-items: baseline;
    }
    .cursor {
      display: inline-block;
      width: 0.5em;
      height: 0.95em;
      background: var(--accent);
      margin-left: 0.18em;
      vertical-align: baseline;
      transform: translateY(0.1em);
      animation: cursor-blink 1.1s step-end infinite;
    }
    @keyframes cursor-blink {
      0%, 50% { opacity: 1; }
      50.01%, 100% { opacity: 0; }
    }

    /* hero / hook */
    .hero {
      display: flex;
      flex-direction: column;
      gap: clamp(20px, 3vh, 28px);
      padding-block: clamp(48px, 7vh, 88px) clamp(28px, 4vh, 44px);
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      min-width: 0;
      position: relative;
      z-index: 2;
      text-align: center;
      align-items: center;
    }
    .eyebrow {
      font-family: var(--f-display);
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
    }
    .headline {
      font-family: var(--f-display);
      font-weight: 700;
      font-size: clamp(1.75rem, 4.6vw, 3.2rem);
      line-height: 1.15;
      letter-spacing: -0.015em;
      text-wrap: balance;
      margin: 0;
      max-width: 22ch;
      color: var(--fg);
    }
    .headline .hl { color: var(--accent); }
    .subline .hl { color: var(--accent); }
    .subline {
      font-family: var(--f-body);
      font-weight: 400;
      font-size: clamp(1.05rem, 1.6vw, 1.3rem);
      line-height: 1.5;
      color: var(--fg);
      max-width: 50ch;
      margin: 0;
    }

    /* video block */
    .video-wrap {
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      padding-inline: 0;
      padding-bottom: clamp(32px, 5vh, 56px);
      position: relative;
      z-index: 2;
    }
    .video-frame {
      position: relative;
      aspect-ratio: 16 / 9;
      width: 100%;
      border: 1px solid var(--rule);
      background: #121110;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .video-frame::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(135deg, transparent 48%, rgba(212,80,42,0.05) 50%, transparent 52%);
      pointer-events: none;
    }
    .video-frame.is-live { background: #000; }
    .video-frame.is-live iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .play-stub {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .play-circle {
      width: 64px;
      height: 64px;
      border: 1px solid var(--fg-dim);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .play-circle svg { width: 18px; height: 18px; fill: var(--fg); margin-left: 2px; }
    .play-stub .runtime {
      font-family: var(--f-display);
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--fg-dim);
    }
    .play-stub .runtime .accent { color: var(--accent); }
    .crop {
      position: absolute;
      width: 14px;
      height: 14px;
      border-color: var(--fg-dim);
      border-style: solid;
      border-width: 0;
      opacity: 0.6;
    }
    .crop-tl { top: 14px; left: 14px; border-top-width: 1px; border-left-width: 1px; }
    .crop-tr { top: 14px; right: 14px; border-top-width: 1px; border-right-width: 1px; }
    .crop-bl { bottom: 14px; left: 14px; border-bottom-width: 1px; border-left-width: 1px; }
    .crop-br { bottom: 14px; right: 14px; border-bottom-width: 1px; border-right-width: 1px; }

    /* CTA block */
    .cta-block {
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      padding-block: clamp(8px, 2vh, 16px) clamp(80px, 14vh, 160px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      position: relative;
      z-index: 2;
      text-align: center;
    }
    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 20px 36px;
      border: 1px solid var(--fg);
      background: transparent;
      text-decoration: none;
      font-family: var(--f-display);
      font-size: clamp(13px, 1.4vw, 15px);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--fg);
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
      max-width: 100%;
    }
    .cta:hover { background: var(--fg); color: var(--bg); }
    .cta:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
    .arrow { display: inline-block; transition: transform 0.25s ease; }
    .cta:hover .arrow { transform: translateX(4px); }

    /* footer */
    .site-footer {
      position: relative;
      z-index: 2;
      max-width: 1080px;
      width: 100%;
      margin: 0 auto;
      padding-block: clamp(32px, 4vh, 48px);
      border-top: 1px solid var(--rule);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
      font-family: var(--f-display);
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--fg-dim);
    }
    .site-footer a { color: var(--fg-dim); text-decoration: none; transition: color 0.2s ease; }
    .site-footer a:hover { color: var(--accent); }
    .footer-left { display: inline-flex; align-items: center; gap: 12px; }
    .footer-right { display: inline-flex; align-items: center; gap: 20px; }

    @media (max-width: 540px) {
      .hero { padding-block: 36px 24px; }
      .headline { font-size: 1.65rem; max-width: 100%; }
      .cta { width: 100%; padding: 18px 22px; }
      .play-circle { width: 52px; height: 52px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>

  <div class="col-rule" style="left: 8.333%"></div>
  <div class="col-rule" style="left: 16.667%"></div>
  <div class="col-rule" style="left: 25%"></div>
  <div class="col-rule" style="left: 33.333%"></div>
  <div class="col-rule" style="left: 41.667%"></div>
  <div class="col-rule" style="left: 50%"></div>
  <div class="col-rule" style="left: 58.333%"></div>
  <div class="col-rule" style="left: 66.667%"></div>
  <div class="col-rule" style="left: 75%"></div>
  <div class="col-rule" style="left: 83.333%"></div>
  <div class="col-rule" style="left: 91.667%"></div>

  <div class="topbar">
    <span class="mark">the borah way<span class="cursor" aria-hidden="true"></span></span>
  </div>

  <section class="hero">
    <span class="eyebrow">The Brand Assessment</span>
    <h1 class="headline">Watch this <span class="hl">before</span> you book the assessment.</h1>
    <p class="subline">Know where your brand is <span class="hl">leaking</span> &mdash; and what to do about it.</p>
  </section>

  <div class="video-wrap">
    <div class="video-frame" id="videoFrame">
      <div class="crop crop-tl"></div>
      <div class="crop crop-tr"></div>
      <div class="crop crop-bl"></div>
      <div class="crop crop-br"></div>
      <div class="play-stub" id="playStub">
        <span class="play-circle" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M5 3l16 9-16 9V3z"/></svg>
        </span>
        <span class="runtime">Video coming soon <span class="accent">&middot;</span> 5&ndash;6 min</span>
      </div>
    </div>
  </div>

  <div class="cta-block">
    <a href="/form" class="cta">
      <span>Book a free assessment</span>
      <span class="arrow" aria-hidden="true">&rarr;</span>
    </a>
  </div>

  <footer class="site-footer">
    <div class="footer-left">
      <span>&copy; 2026 The Borah Way</span>
    </div>
  </footer>

</body>
</html>
